version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cloudchange_user
      POSTGRES_PASSWORD: cloudchange_pass
      POSTGRES_DB: cloudchange_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudchange_user -d cloudchange_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

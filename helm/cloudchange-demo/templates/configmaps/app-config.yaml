apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Values.global.namespace }}
data:
  LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  DB_HOST: "postgres-service"
  USER_SERVICE_URL: "http://user-service:{{ .Values.services.user.port }}"
  PAYMENT_SERVICE_URL: "http://payment-service:{{ .Values.services.payment.port }}"
  ORDER_SERVICE_URL: "http://order-service:{{ .Values.services.order.port }}"

{{- range $name, $service := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.global.namespace }}
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        app: {{ $name }}-service
    spec:
      containers:
        - name: {{ $name }}-service
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $service.image.pullPolicy }}
          ports:
            - containerPort: {{ $service.port }}
          {{- if ne $name "frontend" }}
          envFrom:
            - configMapRef:
                name: app-config
          {{- end }}
          resources:
{{ toYaml $service.resources | indent 12 }}
          readinessProbe:
            httpGet:
              {{- if eq $name "frontend" }}
              path: /
              {{- else }}
              path: /health
              {{- end }}
              port: {{ $service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              {{- if eq $name "frontend" }}
              path: /
              {{- else }}
              path: /health
              {{- end }}
              port: {{ $service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
---
{{- end }}

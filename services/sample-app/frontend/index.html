<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample E-commerce App</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f4f4f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        button { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        #result { margin-top: 1rem; font-family: monospace; white-space: pre-wrap; background: #f8fafc; padding: 1rem; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Buy a Widget</h2>
        <p>Price: $99.99</p>
        <button onclick="checkout()">Checkout (User 1)</button>
        <div id="result"></div>
    </div>

    <script>
        async function checkout() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "Processing...";
            try {
                // In a real k8s cluster, this would point to the gateway ingress
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: 1, item: "Widget", amount: 99.99 })
                });
                const data = await response.json();
                resultDiv.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                resultDiv.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>

# GitLab CI/CD for CloudChange: test -> trivy scan -> build -> trivy image scan -> helm -> risk analysis -> deploy

stages:
  - test
  - scan
  - build
  - image-scan
  - validate
  - analyze
  - deploy

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
  TRIVY_NO_PROGRESS: "true"
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  TRIVY_IMAGE: "aquasec/trivy:0.58.1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/

# ------------------------------------------------------------------ test
backend-test:
  stage: test
  image: python:3.11-slim
  script:
    - cd backend
    - pip install -r requirements.txt
    - python -m pytest tests/ -v

frontend-build:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths: [frontend/dist]
    expire_in: 1 day

# ------------------------------------------------------------------ trivy: source + IaC
.trivy:
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]

trivy-fs:
  extends: .trivy
  stage: scan
  script:
    # Report (never fails the job)
    - trivy fs --config trivy.yaml --scanners vuln,secret,misconfig
        --format json --output trivy-fs.json --exit-code 0 .
    # Gate on dependency CVEs and hardcoded secrets
    - trivy fs --config trivy.yaml --scanners vuln,secret --severity "$TRIVY_SEVERITY"
        --exit-code 1 .
  artifacts:
    when: always
    paths: [trivy-fs.json]
    expire_in: 1 week

trivy-iac:
  extends: .trivy
  stage: scan
  script:
    # Kubernetes manifests, Helm chart and Dockerfiles. Report only; set --exit-code 1 once existing findings are fixed.
    - trivy config --config trivy.yaml --severity "$TRIVY_SEVERITY" --exit-code 0 .
    - trivy config --config trivy.yaml --format json --output trivy-iac.json --exit-code 0 .
  artifacts:
    when: always
    paths: [trivy-iac.json]
    expire_in: 1 week

# ------------------------------------------------------------------ build + push images
.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build-backend:
  extends: .build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" ./backend
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  needs: [backend-test]

build-frontend:
  extends: .build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" ./frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  needs: [frontend-build]

# ------------------------------------------------------------------ trivy: images
.trivy-image:
  extends: .trivy
  stage: image-scan
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    # GitLab Container Scanning report (shows in the MR security widget on Ultimate)
    - trivy image --format template --template "@/contrib/gitlab.tpl"
        --output "gl-container-scanning-report-$SERVICE.json"
        --severity "$TRIVY_SEVERITY" --ignore-unfixed --exit-code 0
        "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA"
    # Gate
    - trivy image --severity "$TRIVY_SEVERITY" --ignore-unfixed --exit-code 1
        "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA"
  artifacts:
    when: always
    paths: ["gl-container-scanning-report-*.json"]
    reports:
      container_scanning: "gl-container-scanning-report-$SERVICE.json"
    expire_in: 1 week

trivy-image-backend:
  extends: .trivy-image
  needs: [build-backend]
  variables:
    SERVICE: backend

trivy-image-frontend:
  extends: .trivy-image
  needs: [build-frontend]
  variables:
    SERVICE: frontend

# ------------------------------------------------------------------ helm
helm-validation:
  stage: validate
  image:
    name: alpine/helm:3.12.0
    entrypoint: [""]
  needs: [backend-test, frontend-build]
  script:
    - helm lint ./helm/cloudchange-demo
    - helm template ./helm/cloudchange-demo > /dev/null

# ------------------------------------------------------------------ cloudchange risk analysis
cloudchange-analysis:
  stage: analyze
  image: python:3.11-slim
  needs: [trivy-fs, trivy-image-backend, trivy-image-frontend, helm-validation]
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - pip install -r backend/requirements.txt
  script:
    - bash scripts/run_cloudchange_analysis.sh analysis.out payment-service
    - cat analysis.out
    - REQUIRES_APPROVAL=$(grep '^requires_approval=' analysis.out | cut -d= -f2)
    - STRATEGY=$(grep '^strategy=' analysis.out | cut -d= -f2)
    - python scripts/gitlab_deploy_pipeline.py "$REQUIRES_APPROVAL" "$STRATEGY" > deploy-pipeline.yml
    - cat deploy-pipeline.yml
  artifacts:
    paths: [deploy-pipeline.yml]
    expire_in: 1 day

# ------------------------------------------------------------------ deploy (child pipeline: manual gate when risk is high)
deploy:
  stage: deploy
  needs: [cloudchange-analysis]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "main"
  trigger:
    include:
      - artifact: deploy-pipeline.yml
        job: cloudchange-analysis
    strategy: depend
